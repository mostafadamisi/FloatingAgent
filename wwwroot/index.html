<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Floating Agent</title>
    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui">An unhandled error occurred. <a href="" class="reload">Reload</a></div>
    <script>
        window.autoScroll = (function () {
            var el = null;
            function init(id) {
                el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('scroll', function () {
                    el._userScrolled = el.scrollHeight - el.scrollTop - el.clientHeight > 60;
                });
            }
            return {
                scroll: function (id) {
                    if (!el) init(id);
                    if (!el) return;
                    if (el._userScrolled) return;
                    el.scrollTop = el.scrollHeight;
                }
            };
        })();
    </script>
    <script src="_framework/blazor.webview.js"></script>
</body>
</html>
